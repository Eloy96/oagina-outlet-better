<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos Better</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root { color-scheme: light; }
    body { -webkit-tap-highlight-color: transparent; }
    .loader { width: 26px; height: 26px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 999px; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .scrollbar-none::-webkit-scrollbar { display: none; }
    .scrollbar-none { scrollbar-width: none; -ms-overflow-style: none; }
    .cart-open #cart-backdrop { opacity: 1; pointer-events: auto; }
    .cart-open #cart-panel { transform: translateX(0); }
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); }
    .product-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, .08); overflow: hidden; display: flex; flex-direction: column; min-width: 0; height: 100%; }
    .featured-card { flex: 0 0 168px; width: 168px; height: auto; }
    .card-media { appearance: none; border: 0; border-bottom: 1px solid #f1f5f9; background: #fff; cursor: pointer; display: block; height: 168px; overflow: hidden; padding: 0; position: relative; width: 100%; }
    .featured-card .card-media { height: 142px; }
    .product-img { display: block; height: calc(100% - 16px); inset: 8px; max-height: calc(100% - 16px); max-width: calc(100% - 16px); object-fit: contain; position: absolute; width: calc(100% - 16px); }
    .card-body { display: flex; flex: 1; flex-direction: column; min-height: 132px; padding: 12px; }
    .featured-card .card-body { min-height: 124px; padding: 10px; }
    .card-sku { color: #94a3b8; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-name { color: #0f172a; display: -webkit-box; font-size: 14px; font-weight: 900; line-height: 1.25; margin-top: 5px; min-height: 36px; overflow: hidden; -webkit-box-orient: vertical; -webkit-line-clamp: 2; }
    .featured-card .card-name { font-size: 12px; min-height: 31px; }
    .card-footer { align-items: flex-end; display: flex; gap: 8px; justify-content: space-between; margin-top: auto; padding-top: 8px; }
    .card-price { color: #0f172a; font-size: 18px; font-weight: 900; line-height: 1.1; }
    .featured-card .card-price { font-size: 15px; }
    .card-stock { color: #64748b; font-size: 10px; line-height: 1.2; margin-top: 3px; }
    .cart-add, .cart-soldout { align-items: center; border: 0; border-radius: 999px; display: grid; flex: 0 0 auto; height: 38px; justify-items: center; width: 38px; }
    .cart-add { background: #d1fae5; color: #047857; cursor: pointer; }
    .cart-soldout { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }
    .cart-qty { align-items: center; background: #1d4ed8; border-radius: 999px; color: #fff; display: flex; flex: 0 0 auto; overflow: hidden; }
    .cart-qty-button { align-items: center; background: transparent; border: 0; color: inherit; cursor: pointer; display: grid; height: 34px; place-items: center; width: 32px; }
    .cart-qty-button:disabled { cursor: not-allowed; opacity: .45; }
    .cart-qty-text { font-size: 12px; font-weight: 900; min-width: 24px; text-align: center; }
    .image-placeholder { align-items: center; background: #f1f5f9; color: #cbd5e1; display: grid; inset: 8px; place-items: center; position: absolute; }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); }
      .card-media { height: 190px; }
      .featured-card { flex-basis: 176px; width: 176px; }
    }
    @media (max-width: 480px) {
      .product-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .card-media { height: 150px; }
      .featured-card { flex-basis: 150px; width: 150px; }
      .featured-card .card-media { height: 128px; }
      .card-body { min-height: 126px; padding: 10px; }
      .card-name { font-size: 13px; min-height: 34px; }
      .card-price { font-size: 16px; }
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-900">
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white grid place-items-center shrink-0">
          <i data-lucide="package-search" class="w-5 h-5"></i>
        </div>
        <div class="min-w-0">
          <h1 class="font-black text-lg leading-tight truncate">Productos Better</h1>
          <p id="status-label" class="text-xs text-slate-500">Cargando catalogo...</p>
        </div>
        <button id="cart-main-button" class="ml-auto relative w-12 h-12 rounded-full bg-emerald-600 text-white grid place-items-center shadow-lg shadow-emerald-100 active:scale-95">
          <i data-lucide="shopping-cart" class="w-6 h-6"></i>
          <span id="cart-badge" class="hidden absolute -top-1 -right-1 min-w-5 h-5 px-1 rounded-full bg-red-600 border-2 border-white text-[10px] font-black grid place-items-center">0</span>
        </button>
      </div>

      <div class="mt-3 flex gap-2">
        <div class="relative flex-1">
          <input id="search-input" class="w-full h-11 rounded-xl border border-slate-200 bg-slate-100 pl-10 pr-10 text-sm outline-none focus:bg-white focus:border-blue-500 focus:ring-4 focus:ring-blue-100" placeholder="Buscar producto o SKU">
          <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
          <button id="clear-search" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1 text-slate-400">
            <i data-lucide="x-circle" class="w-5 h-5"></i>
          </button>
        </div>
        <select id="sort-select" class="h-11 rounded-xl border border-slate-200 bg-white px-2 text-xs font-bold outline-none focus:ring-4 focus:ring-blue-100">
          <option value="recent">Recientes</option>
          <option value="name">A-Z</option>
          <option value="priceAsc">Precio + bajo</option>
          <option value="priceDesc">Precio + alto</option>
          <option value="stock">Stock</option>
        </select>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 sm:px-4 pb-28 pt-4">
    <section class="grid grid-cols-3 gap-2 mb-4">
      <div class="rounded-xl bg-white border border-slate-200 p-3">
        <p class="text-[10px] font-black uppercase text-slate-500">Productos</p>
        <p id="stat-count" class="text-xl font-black">0</p>
      </div>
      <div class="rounded-xl bg-white border border-slate-200 p-3">
        <p class="text-[10px] font-black uppercase text-slate-500">Piezas</p>
        <p id="stat-stock" class="text-xl font-black text-emerald-700">0</p>
      </div>
      <div class="rounded-xl bg-white border border-slate-200 p-3">
        <p class="text-[10px] font-black uppercase text-slate-500">Pedido</p>
        <p id="stat-cart" class="text-xl font-black text-blue-700">$0</p>
      </div>
    </section>

    <section id="loading-state" class="grid place-items-center py-24">
      <div class="text-center">
        <div class="loader mx-auto mb-3"></div>
        <p class="text-sm text-slate-500">Cargando productos...</p>
      </div>
    </section>

    <section id="featured-section" class="hidden mb-6">
      <div class="flex items-center justify-between mb-2">
        <h2 class="font-black uppercase text-sm tracking-wide flex items-center gap-2">
          <i data-lucide="sparkles" class="w-4 h-4 text-blue-600"></i>
          Destacados
        </h2>
      </div>
      <div id="featured-track" class="flex gap-3 overflow-x-auto scrollbar-none pb-1"></div>
    </section>

    <section id="catalog-section" class="hidden">
      <div class="flex items-center justify-between mb-3">
        <h2 id="catalog-title" class="font-black uppercase text-sm tracking-wide">Catalogo</h2>
        <button id="refresh-button" class="rounded-lg border border-slate-200 bg-white px-3 py-2 text-xs font-bold flex items-center gap-1">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
          Actualizar
        </button>
      </div>
      <div id="products-grid" class="product-grid grid gap-3 md:gap-4"></div>
    </section>

    <section id="empty-state" class="hidden py-20 text-center">
      <div class="w-16 h-16 rounded-full bg-slate-100 text-slate-400 grid place-items-center mx-auto mb-4">
        <i data-lucide="search-x" class="w-8 h-8"></i>
      </div>
      <h2 class="font-black">Sin resultados</h2>
      <p class="text-sm text-slate-500 mt-1">Prueba con otro nombre o SKU.</p>
    </section>
  </main>

  <div id="cart-backdrop" class="fixed inset-0 z-50 bg-black/45 opacity-0 pointer-events-none transition"></div>
  <aside id="cart-panel" class="fixed right-0 top-0 z-[60] h-full w-full max-w-md bg-white shadow-2xl translate-x-full transition-transform duration-300 flex flex-col">
    <div class="p-4 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
      <div>
        <h2 class="font-black text-lg flex items-center gap-2">
          <i data-lucide="shopping-bag" class="w-5 h-5 text-emerald-600"></i>
          Mi pedido
        </h2>
        <p class="text-xs text-slate-500">Revisa cantidades antes de enviar.</p>
      </div>
      <button id="close-cart" class="p-2 rounded-full hover:bg-slate-200">
        <i data-lucide="x" class="w-6 h-6"></i>
      </button>
    </div>

    <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

    <div class="border-t border-slate-200 bg-slate-50 p-4">
      <div class="grid grid-cols-2 gap-2 mb-2">
        <input id="customer-name" class="rounded-lg border border-slate-200 p-3 text-sm outline-none focus:border-blue-500" placeholder="Nombre">
        <input id="customer-phone" class="rounded-lg border border-slate-200 p-3 text-sm outline-none focus:border-blue-500" placeholder="Telefono">
      </div>
      <textarea id="customer-notes" class="w-full rounded-lg border border-slate-200 p-3 text-sm outline-none focus:border-blue-500 mb-3" rows="2" placeholder="Notas opcionales"></textarea>
      <div class="flex items-center justify-between mb-3">
        <span class="text-sm font-bold text-slate-500">Total</span>
        <span id="cart-total" class="text-2xl font-black">$0.00</span>
      </div>
      <button id="checkout-button" class="w-full rounded-xl bg-emerald-600 text-white py-3.5 font-black flex items-center justify-center gap-2 shadow-lg shadow-emerald-100 disabled:opacity-60">
        <i data-lucide="message-circle" class="w-5 h-5"></i>
        Enviar por WhatsApp
      </button>
    </div>
  </aside>

  <div id="image-modal" class="hidden fixed inset-0 z-[70] bg-black/95 p-4 place-items-center">
    <button id="close-image" class="absolute top-4 right-4 p-2 text-white/80">
      <i data-lucide="x" class="w-8 h-8"></i>
    </button>
    <div class="text-center">
      <img id="modal-image" class="max-h-[82vh] max-w-full object-contain rounded-lg mx-auto" alt="">
      <p id="modal-caption" class="text-white font-bold mt-3"></p>
    </div>
  </div>

  <div id="toast" class="hidden fixed top-24 left-1/2 -translate-x-1/2 z-[80] max-w-[92vw] rounded-full px-5 py-3 text-sm font-bold text-white shadow-2xl text-center"></div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec";
    const WHATSAPP_NUMBER = "525542145295";
    const CART_KEY = "productos_better_cart_simple_v1";

    const state = {
      products: [],
      visible: [],
      cart: loadCart(),
      loading: false
    };

    const $ = id => document.getElementById(id);

    document.addEventListener("DOMContentLoaded", () => {
      bindEvents();
      refreshProducts(true);
      setInterval(() => refreshProducts(false), 60000);
      lucide.createIcons();
    });

    function bindEvents() {
      $("search-input").addEventListener("input", applyFilters);
      $("sort-select").addEventListener("change", applyFilters);
      $("clear-search").addEventListener("click", () => {
        $("search-input").value = "";
        applyFilters();
      });
      $("refresh-button").addEventListener("click", () => refreshProducts(true));
      $("cart-main-button").addEventListener("click", openCart);
      $("close-cart").addEventListener("click", closeCart);
      $("cart-backdrop").addEventListener("click", closeCart);
      $("checkout-button").addEventListener("click", checkout);
      $("close-image").addEventListener("click", closeImage);
      $("image-modal").addEventListener("click", event => {
        if (event.target === $("image-modal")) closeImage();
      });
    }

    async function refreshProducts(showLoader) {
      if (state.loading) return;
      state.loading = true;
      if (showLoader) $("loading-state").classList.remove("hidden");

      try {
        const response = await fetch(`${API_URL}?action=getAll&limit=1000`, { redirect: "follow" });
        const json = await response.json();
        if (json.status !== "success") throw new Error(json.error || "Respuesta invalida");

        state.products = (json.data || []).map(normalizeProduct).filter(p => p.sku);
        syncCart();
        applyFilters();
        renderFeatured();
        $("status-label").textContent = "Actualizado " + new Date().toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
      } catch (error) {
        console.error(error);
        $("status-label").textContent = "No se pudo actualizar";
        toast("No se pudo cargar el catalogo", "error");
      } finally {
        state.loading = false;
        $("loading-state").classList.add("hidden");
      }
    }

    function applyFilters() {
      const termRaw = $("search-input").value.trim();
      const terms = normalizeText(termRaw).split(" ").filter(Boolean);
      let list = state.products.filter(product => {
        const haystack = normalizeText(`${product.name} ${product.sku}`);
        return terms.every(term => haystack.includes(term));
      });

      const sort = $("sort-select").value;
      if (sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "es"));
      if (sort === "priceAsc") list.sort((a, b) => a.price - b.price);
      if (sort === "priceDesc") list.sort((a, b) => b.price - a.price);
      if (sort === "stock") list.sort((a, b) => b.stock - a.stock);

      state.visible = list;
      $("clear-search").classList.toggle("hidden", !termRaw);
      $("catalog-title").textContent = termRaw ? `Resultados (${list.length})` : `Catalogo completo (${list.length})`;
      renderGrid();
      renderStats();
    }

    function renderGrid() {
      const grid = $("products-grid");
      grid.innerHTML = "";
      $("catalog-section").classList.toggle("hidden", state.visible.length === 0);
      $("empty-state").classList.toggle("hidden", state.visible.length > 0 || state.products.length === 0);

      const fragment = document.createDocumentFragment();
      state.visible.forEach(product => fragment.appendChild(productCard(product, false)));
      grid.appendChild(fragment);
      lucide.createIcons();
    }

    function renderFeatured() {
      const items = state.products.filter(p => p.stock > 0).slice(0, 12);
      const track = $("featured-track");
      track.innerHTML = "";
      $("featured-section").classList.toggle("hidden", items.length === 0);
      items.forEach(product => track.appendChild(productCard(product, true)));
      lucide.createIcons();
    }

    function productCard(product, compact) {
      const inCart = state.cart[product.sku] || 0;
      const soldOut = product.stock <= 0;
      const card = document.createElement("article");
      card.className = compact ? "product-card featured-card" : "product-card";

      const imageButton = document.createElement("button");
      imageButton.type = "button";
      imageButton.className = "card-media";
      imageButton.addEventListener("click", () => openImage(product));

      if (product.imageSafe) {
        const img = document.createElement("img");
        img.src = product.imageSafe;
        img.alt = product.name;
        img.loading = "lazy";
        img.className = "product-img";
        img.onerror = () => img.replaceWith(imagePlaceholder());
        imageButton.appendChild(img);
      } else {
        imageButton.appendChild(imagePlaceholder());
      }

      if (soldOut) {
        const sold = document.createElement("div");
        sold.className = "absolute inset-0 bg-white/70 grid place-items-center";
        sold.innerHTML = '<span class="rounded-full bg-slate-900 text-white px-2 py-1 text-[10px] font-black">AGOTADO</span>';
        imageButton.appendChild(sold);
      }

      const body = document.createElement("div");
      body.className = "card-body";

      const sku = document.createElement("p");
      sku.className = "card-sku";
      sku.textContent = "SKU: " + product.sku;

      const name = document.createElement("h3");
      name.className = "card-name";
      name.textContent = product.name;

      const bottom = document.createElement("div");
      bottom.className = "card-footer";

      const price = document.createElement("div");
      price.innerHTML = `<p class="card-price">${formatPrice(product.price)}</p><p class="card-stock">Stock: ${product.stock}</p>`;

      const actions = document.createElement("div");
      actions.appendChild(cartControl(product, inCart, soldOut));

      bottom.append(price, actions);
      body.append(sku, name, bottom);
      card.append(imageButton, body);
      return card;
    }

    function cartControl(product, qty, soldOut) {
      if (soldOut) {
        const button = document.createElement("button");
        button.type = "button";
        button.disabled = true;
        button.className = "cart-soldout";
        button.innerHTML = '<i data-lucide="slash" class="w-4 h-4"></i>';
        return button;
      }

      if (!qty) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cart-add";
        button.innerHTML = '<i data-lucide="plus" class="w-5 h-5"></i>';
        button.addEventListener("click", event => {
          event.stopPropagation();
          changeQty(product.sku, 1);
          toast("Agregado al carrito");
        });
        return button;
      }

      const wrap = document.createElement("div");
      wrap.className = "cart-qty";
      wrap.append(
        qtyButton("minus", () => changeQty(product.sku, -1)),
        qtyText(qty),
        qtyButton("plus", () => changeQty(product.sku, 1), qty >= product.stock)
      );
      return wrap;
    }

    function qtyButton(icon, action, disabled) {
      const button = document.createElement("button");
      button.type = "button";
      button.disabled = disabled;
      button.className = "cart-qty-button";
      button.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4"></i>`;
      button.addEventListener("click", event => {
        event.stopPropagation();
        action();
      });
      return button;
    }

    function qtyText(qty) {
      const span = document.createElement("span");
      span.className = "cart-qty-text";
      span.textContent = qty;
      return span;
    }

    function changeQty(sku, delta) {
      const product = findProduct(sku);
      if (!product) return;
      const current = state.cart[sku] || 0;
      const next = Math.max(0, Math.min(product.stock, current + delta));

      if (next === 0) delete state.cart[sku];
      else state.cart[sku] = next;

      if (current + delta > product.stock) toast(`Solo hay ${product.stock} disponibles`, "error");
      saveCart();
      renderGrid();
      renderFeatured();
      renderCart();
      renderStats();
    }

    function renderCart() {
      const container = $("cart-items");
      const lines = cartLines();
      container.innerHTML = "";

      if (lines.length === 0) {
        container.innerHTML = `
          <div class="py-14 text-center text-slate-500">
            <i data-lucide="shopping-cart" class="w-12 h-12 mx-auto mb-3 opacity-40"></i>
            <p class="font-bold">Tu pedido esta vacio</p>
          </div>`;
        lucide.createIcons();
        return;
      }

      lines.forEach(({ product, qty }) => {
        const item = document.createElement("div");
        item.className = "flex gap-3 rounded-xl border border-slate-200 bg-white p-3";

        const imgBox = document.createElement("div");
        imgBox.className = "w-16 h-16 rounded-lg bg-slate-50 border border-slate-100 grid place-items-center shrink-0 overflow-hidden";
        if (product.imageSafe) {
          const img = document.createElement("img");
          img.src = product.imageSafe;
          img.alt = product.name;
          img.className = "w-full h-full object-contain";
          img.onerror = () => img.replaceWith(imagePlaceholder());
          imgBox.appendChild(img);
        } else {
          imgBox.appendChild(imagePlaceholder());
        }

        const info = document.createElement("div");
        info.className = "min-w-0 flex-1";
        info.innerHTML = `
          <h4 class="font-black text-sm truncate">${escapeHtml(product.name)}</h4>
          <p class="text-[11px] text-slate-500 font-mono">SKU: ${escapeHtml(product.sku)} | Disp: ${product.stock}</p>
        `;
        const controls = document.createElement("div");
        controls.className = "mt-2 inline-flex items-center rounded-lg bg-slate-100 overflow-hidden";
        controls.append(
          qtyButton("minus", () => changeQty(product.sku, -1)),
          qtyText(qty),
          qtyButton("plus", () => changeQty(product.sku, 1), qty >= product.stock)
        );
        info.appendChild(controls);

        const price = document.createElement("div");
        price.className = "text-right";
        price.innerHTML = `<p class="font-black text-blue-700">${formatPrice(product.price * qty)}</p><p class="text-[10px] text-slate-500">c/u ${formatPrice(product.price)}</p>`;

        item.append(imgBox, info, price);
        container.appendChild(item);
      });
      lucide.createIcons();
    }

    async function checkout() {
      const lines = cartLines();
      if (lines.length === 0) return toast("Agrega productos primero", "error");

      const button = $("checkout-button");
      button.disabled = true;
      button.innerHTML = '<div class="loader !w-5 !h-5 !border-2 !border-white/40 !border-t-white"></div> Confirmando stock...';

      try {
        const payload = {
          action: "checkout",
          items: lines.map(line => ({ sku: line.product.sku, qty: line.qty })),
          customer: {
            name: $("customer-name").value.trim(),
            phone: $("customer-phone").value.trim()
          },
          notes: $("customer-notes").value.trim()
        };

        const response = await fetch(API_URL, {
          method: "POST",
          redirect: "follow",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(payload)
        });
        const json = await response.json();

        if (json.status === "success") {
          openWhatsapp(json);
          state.cart = {};
          saveCart();
          closeCart();
          toast("Pedido confirmado");
          refreshProducts(false);
        } else if (json.status === "insufficient_stock") {
          toast("No hay stock suficiente. Actualizando...", "error");
          refreshProducts(false);
        } else {
          throw new Error(json.error || "No se pudo confirmar");
        }
      } catch (error) {
        console.error(error);
        toast("No se pudo confirmar el pedido", "error");
      } finally {
        button.disabled = false;
        button.innerHTML = '<i data-lucide="message-circle" class="w-5 h-5"></i> Enviar por WhatsApp';
        lucide.createIcons();
      }
    }

    function openWhatsapp(order) {
      let message = `Hola, confirmo mi pedido de Productos Better.%0A`;
      if (order.orderId) message += `%0AFolio: ${encodeURIComponent(order.orderId)}%0A`;
      message += "%0A";

      const items = order.items && order.items.length ? order.items : cartLines().map(line => ({
        name: line.product.name,
        sku: line.product.sku,
        qty: line.qty,
        price: line.product.price
      }));

      items.forEach(item => {
        message += `- ${encodeURIComponent(item.name)} (SKU: ${encodeURIComponent(item.sku)})%0A`;
        message += `  ${item.qty} x ${encodeURIComponent(formatPrice(item.price))} = ${encodeURIComponent(formatPrice(item.qty * item.price))}%0A`;
      });
      message += `%0ATotal: ${encodeURIComponent(formatPrice(order.total || cartTotal()))}`;

      const notes = $("customer-notes").value.trim();
      if (notes) message += `%0ANotas: ${encodeURIComponent(notes)}`;

      window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${message}`, "_blank");
    }

    function openCart() {
      renderCart();
      document.body.classList.add("cart-open");
    }

    function closeCart() {
      document.body.classList.remove("cart-open");
    }

    function openImage(product) {
      if (!product.imageSafe) return;
      $("modal-image").src = product.imageSafe.replace("sz=w600", "sz=w1200").replace("sz=w800", "sz=w1200");
      $("modal-image").alt = product.name;
      $("modal-caption").textContent = product.name;
      $("image-modal").classList.remove("hidden");
      $("image-modal").classList.add("grid");
    }

    function closeImage() {
      $("image-modal").classList.add("hidden");
      $("image-modal").classList.remove("grid");
      $("modal-image").src = "";
    }

    function renderStats() {
      const totalStock = state.products.reduce((sum, product) => sum + Math.max(0, product.stock), 0);
      $("stat-count").textContent = state.products.length;
      $("stat-stock").textContent = totalStock;
      $("stat-cart").textContent = formatPrice(cartTotal());
      $("cart-total").textContent = formatPrice(cartTotal());
      const count = cartLines().reduce((sum, line) => sum + line.qty, 0);
      $("cart-badge").textContent = count;
      $("cart-badge").classList.toggle("hidden", count === 0);
    }

    function syncCart() {
      Object.keys(state.cart).forEach(sku => {
        const product = findProduct(sku);
        if (!product || product.stock <= 0) delete state.cart[sku];
        else state.cart[sku] = Math.min(state.cart[sku], product.stock);
      });
      saveCart();
    }

    function cartLines() {
      return Object.entries(state.cart)
        .map(([sku, qty]) => ({ product: findProduct(sku), qty }))
        .filter(line => line.product && line.qty > 0);
    }

    function cartTotal() {
      return cartLines().reduce((sum, line) => sum + line.product.price * line.qty, 0);
    }

    function findProduct(sku) {
      return state.products.find(product => product.sku === sku);
    }

    function normalizeProduct(product) {
      return {
        name: String(product.name || "Producto sin nombre").trim(),
        sku: String(product.sku || "").trim().toUpperCase(),
        stock: Number(product.stock || 0),
        price: Number(product.price || 0),
        image: String(product.image || ""),
        imageSafe: imageUrl(product.image)
      };
    }

    function imageUrl(link) {
      const value = String(link || "").trim();
      if (!value) return "";
      const match = value.match(/id=([a-zA-Z0-9_-]{20,})/) || value.match(/\/d\/([a-zA-Z0-9_-]{20,})\//);
      if (match) return `https://drive.google.com/thumbnail?id=${match[1]}&sz=w800`;
      return value;
    }

    function imagePlaceholder() {
      const div = document.createElement("div");
      div.className = "image-placeholder";
      div.innerHTML = '<i data-lucide="image-off" class="w-7 h-7"></i>';
      return div;
    }

    function loadCart() {
      try { return JSON.parse(localStorage.getItem(CART_KEY) || "{}"); }
      catch { return {}; }
    }

    function saveCart() {
      localStorage.setItem(CART_KEY, JSON.stringify(state.cart));
    }

    function normalizeText(value) {
      return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
    }

    function formatPrice(value) {
      return Number(value || 0).toLocaleString("es-MX", { style: "currency", currency: "MXN" });
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[char]));
    }

    function toast(message, type = "success") {
      const el = $("toast");
      el.textContent = message;
      el.className = `fixed top-24 left-1/2 -translate-x-1/2 z-[80] max-w-[92vw] rounded-full px-5 py-3 text-sm font-bold text-white shadow-2xl text-center ${type === "error" ? "bg-red-600" : "bg-emerald-600"}`;
      el.classList.remove("hidden");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => el.classList.add("hidden"), 3000);
    }
  </script>
</body>
</html>
