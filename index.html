<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catálogo Digital</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        
        .loader { border: 4px solid #f3f3f3; border-radius: 50%; border-top: 4px solid #3b82f6; width: 40px; height: 40px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-2 text-blue-600">
                <i data-lucide="store" class="w-6 h-6"></i>
                <h1 class="text-xl font-bold tracking-tight text-gray-800">Tienda Online</h1>
            </div>
            
            <!-- Botón de contacto (WhatsApp simulado) -->
            <a href="#" class="text-sm font-medium text-gray-500 hover:text-blue-600 flex items-center gap-1">
                <i data-lucide="message-circle" class="w-4 h-4"></i> Ayuda
            </a>
        </div>
    </nav>

    <!-- Header / Buscador -->
    <header class="bg-blue-600 text-white py-12 px-4 shadow-lg mb-8">
        <div class="max-w-2xl mx-auto text-center">
            <h2 class="text-3xl font-bold mb-2">Encuentra lo que buscas</h2>
            <p class="text-blue-100 mb-6 text-sm">Explora nuestro catálogo completo actualizado en tiempo real.</p>
            
            <div class="relative max-w-lg mx-auto">
                <input type="text" id="search-input" placeholder="Buscar producto por nombre o SKU..." 
                       class="w-full p-4 pl-12 rounded-full text-gray-800 focus:outline-none focus:ring-4 focus:ring-blue-300 shadow-xl transition"
                       onkeyup="app.filterProducts()">
                <i data-lucide="search" class="absolute left-4 top-4 text-gray-400 w-5 h-5"></i>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-6xl mx-auto px-4 pb-12 w-full">
        
        <!-- Estado de Carga -->
        <div id="loader-container" class="flex flex-col items-center justify-center py-20">
            <div class="loader mb-4"></div>
            <p class="text-gray-400 text-sm animate-pulse">Cargando productos...</p>
        </div>

        <!-- Grid de Productos -->
        <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6 hidden">
            <!-- Las tarjetas se inyectan aquí -->
        </div>

        <!-- Estado Vacío / Error -->
        <div id="empty-state" class="hidden text-center py-20">
            <div class="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 text-gray-400">
                <i data-lucide="package-open" class="w-10 h-10"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-700">No se encontraron productos</h3>
            <p class="text-gray-500 text-sm mt-1">Intenta con otra búsqueda o recarga la página.</p>
            <button onclick="location.reload()" class="mt-4 text-blue-600 font-medium hover:underline">Recargar</button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-8 mt-auto">
        <div class="max-w-6xl mx-auto px-4 text-center text-gray-400 text-sm">
            <p>&copy; 2024 Mi Tienda. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        const app = {
            // URL FIJA DEL SCRIPT DE GOOGLE (Ya configurada)
            apiUrl: "https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec", 
            
            allProducts: [],

            init() {
                lucide.createIcons();
                // Carga automática inmediata
                this.fetchProducts();
            },

            async fetchProducts() {
                const loader = document.getElementById('loader-container');
                const grid = document.getElementById('products-grid');
                const empty = document.getElementById('empty-state');

                loader.classList.remove('hidden');
                grid.classList.add('hidden');
                empty.classList.add('hidden');

                try {
                    // Petición GET con redirect: 'follow'
                    const response = await fetch(`${this.apiUrl}?action=getAll`, { redirect: 'follow' });
                    const json = await response.json();

                    if (json.status === 'success') {
                        this.allProducts = json.data;
                        this.renderProducts(this.allProducts);
                    } else {
                        throw new Error("Error en datos");
                    }
                } catch (e) {
                    console.error(e);
                    empty.querySelector('h3').innerText = "Error de conexión";
                    empty.classList.remove('hidden');
                } finally {
                    loader.classList.add('hidden');
                }
            },

            renderProducts(products) {
                const grid = document.getElementById('products-grid');
                const empty = document.getElementById('empty-state');
                
                grid.innerHTML = ''; // Limpiar

                if (products.length === 0) {
                    grid.classList.add('hidden');
                    empty.classList.remove('hidden');
                    return;
                }

                products.forEach(p => {
                    // Procesar imagen
                    const imgUrl = this.processImage(p.image);
                    const price = parseFloat(p.price).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });

                    const card = document.createElement('div');
                    card.className = 'product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden fade-in flex flex-col h-full';
                    
                    card.innerHTML = `
                        <div class="relative w-full aspect-square bg-gray-50 overflow-hidden">
                            ${imgUrl 
                                ? `<img src="${imgUrl}" class="w-full h-full object-cover object-center" loading="lazy" onerror="this.parentElement.innerHTML='<div class=\\'w-full h-full flex items-center justify-center text-gray-300\\'><i data-lucide=\\'image-off\\'></i></div>'; lucide.createIcons();">`
                                : `<div class="w-full h-full flex items-center justify-center text-gray-300"><i data-lucide="image" class="w-10 h-10"></i></div>`
                            }
                            ${parseInt(p.stock) === 0 
                                ? `<div class="absolute top-2 right-2 bg-red-500 text-white text-[10px] font-bold px-2 py-1 rounded">AGOTADO</div>` 
                                : ``
                            }
                        </div>
                        <div class="p-4 flex flex-col flex-1">
                            <p class="text-xs text-gray-400 font-mono mb-1 uppercase">SKU: ${p.sku}</p>
                            <h3 class="font-bold text-gray-800 text-sm leading-tight mb-2 line-clamp-2 flex-1" title="${p.name}">${p.name}</h3>
                            <div class="mt-auto pt-2 border-t border-gray-50 flex justify-between items-end">
                                <div>
                                    <span class="block text-[10px] text-gray-400">Precio</span>
                                    <span class="text-lg font-bold text-blue-600">${price}</span>
                                </div>
                                <button class="bg-blue-50 text-blue-600 p-2 rounded-full hover:bg-blue-100 transition" title="Ver detalles">
                                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                grid.classList.remove('hidden');
                empty.classList.add('hidden');
                lucide.createIcons();
            },

            filterProducts() {
                const term = document.getElementById('search-input').value.toLowerCase();
                const filtered = this.allProducts.filter(p => 
                    p.name.toLowerCase().includes(term) || 
                    p.sku.toLowerCase().includes(term)
                );
                this.renderProducts(filtered);
            },

            processImage(link) {
                if (!link) return null;
                if (link.startsWith('data:')) return link; // Si es base64 directo (raro en catalogo publico pero posible)
                
                // Extraer ID de Drive para usar thumbnail de alta velocidad
                let id = null;
                const patterns = [
                    /id=([a-zA-Z0-9_-]{25,})/,
                    /\/d\/([a-zA-Z0-9_-]{25,})\//,
                    /open\?id=([a-zA-Z0-9_-]{25,})/
                ];
                
                for (let p of patterns) {
                    const match = link.match(p);
                    if (match && match[1]) {
                        id = match[1];
                        break;
                    }
                }
                
                if (id) {
                    // sz=w500 pide una imagen optimizada de 500px de ancho (bueno para grid)
                    return `https://drive.google.com/thumbnail?id=${id}&sz=w500`; 
                }
                
                return link;
            }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
