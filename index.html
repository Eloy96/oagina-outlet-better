<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Productos Better</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconos Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { -webkit-tap-highlight-color: transparent; }
        .fade-in { animation: fadeIn 0.5s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .product-card { transition: transform 0.2s, box-shadow 0.2s; }
        .product-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.08); }
        
        /* Loader */
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3b82f6; width: 30px; height: 30px; -webkit-animation: spin 1s linear infinite; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Estilos Carrusel */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Zoom sutil */
        .img-hover-scale { transition: transform 0.3s ease; }
        .group:hover .img-hover-scale { transform: scale(1.05); }

        /* Animación Carrito */
        @keyframes bounce-in { 0% { transform: scale(1); } 50% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .badge-anim { animation: bounce-in 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    </style>
</head>
<body class="bg-gray-50 font-sans min-h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2 text-blue-700">
                <i data-lucide="package-search" class="w-6 h-6"></i>
                <h1 class="text-lg font-black tracking-tighter uppercase">Productos Better</h1>
            </div>
            <div class="flex items-center gap-2">
                <span class="relative flex h-2.5 w-2.5">
                  <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                  <span class="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                </span>
            </div>
        </div>
    </nav>

    <!-- Search Header Sticky -->
    <div class="bg-white/95 backdrop-blur-md border-b border-gray-200 sticky top-[52px] z-30 px-4 py-3 shadow-sm">
        <div class="max-w-3xl mx-auto relative">
            <input type="text" id="search-input" placeholder="Buscar (Ej: Repisa, Mesa...)" 
                   class="w-full bg-gray-100 border-none rounded-full py-2.5 pl-10 pr-10 text-gray-700 focus:ring-2 focus:ring-blue-500 focus:bg-white transition shadow-inner text-sm"
                   oninput="app.filterProducts()">
            <i data-lucide="search" class="absolute left-3.5 top-1/2 transform -translate-y-1/2 text-gray-400 w-4 h-4"></i>
            <button id="clear-search" onclick="app.clearSearch()" class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
                <i data-lucide="x-circle" class="w-4 h-4"></i>
            </button>
        </div>
    </div>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl mx-auto px-4 pb-24 w-full overflow-hidden mt-6">
        
        <!-- Loader Inicial -->
        <div id="loader-container" class="flex flex-col items-center justify-center py-32">
            <div class="loader mb-4"></div>
            <p class="text-gray-400 text-xs animate-pulse">Cargando catálogo...</p>
        </div>

        <!-- CONTENEDOR DE "VITRINA" (Se oculta al buscar) -->
        <div id="showcase-container" class="space-y-10 fade-in hidden">
            
            <!-- MOSAICO DESTACADO -->
            <section>
                <div class="flex items-center gap-2 mb-3 px-1">
                    <i data-lucide="star" class="text-yellow-500 fill-yellow-500 w-4 h-4"></i>
                    <h3 class="text-base font-bold text-gray-800 uppercase tracking-wide">Destacados</h3>
                </div>
                <div id="featured-mosaic" class="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4"></div>
            </section>

            <!-- CARRUSEL DE NOVEDADES -->
            <section>
                <div class="flex items-center gap-2 mb-3 px-1">
                    <i data-lucide="sparkles" class="text-blue-500 w-4 h-4"></i>
                    <h3 class="text-base font-bold text-gray-800 uppercase tracking-wide">Lo más nuevo</h3>
                </div>
                <div class="relative group">
                    <div id="carousel-track" class="flex gap-3 overflow-x-auto hide-scrollbar pb-4 snap-x snap-mandatory scroll-smooth">
                        <!-- Items inyectados -->
                    </div>
                </div>
            </section>

            <div class="border-t border-gray-200"></div>
        </div>

        <!-- GRID DE RESULTADOS -->
        <div id="grid-section" class="hidden fade-in mt-6">
            <div class="flex items-center justify-between mb-4 px-1">
                <h3 id="grid-title" class="text-base font-bold text-gray-800 uppercase tracking-wide flex items-center gap-2">
                    <i data-lucide="grid" class="text-gray-400 w-4 h-4"></i> Catálogo Completo
                </h3>
                <span id="result-count" class="text-[10px] text-gray-500 font-medium bg-white border px-2 py-1 rounded-full"></span>
            </div>

            <div id="products-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-3 md:gap-6">
                <!-- Tarjetas se inyectan aquí -->
            </div>
            
            <!-- Loader de Scroll Infinito -->
            <div id="scroll-loader" class="py-8 hidden flex justify-center">
                <div class="loader !w-6 !h-6 !border-2"></div>
            </div>
        </div>

        <!-- Estado Sin Resultados -->
        <div id="empty-state" class="hidden text-center py-20 fade-in">
            <div class="bg-gray-100 rounded-full w-20 h-20 flex items-center justify-center mx-auto mb-4 text-gray-300">
                <i data-lucide="search-x" class="w-8 h-8"></i>
            </div>
            <h3 class="text-lg font-bold text-gray-700">Sin coincidencias</h3>
            <p class="text-gray-500 text-xs mt-2">Intenta palabras más generales.</p>
            <button onclick="app.clearSearch()" class="mt-6 px-6 py-2 bg-blue-600 text-white rounded-full text-sm font-medium hover:bg-blue-700 transition shadow-lg shadow-blue-200">
                Ver todo
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t py-6 mt-auto mb-20">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <p class="text-gray-400 text-[10px] font-bold uppercase tracking-widest mb-1">Productos Better</p>
            <p class="text-gray-300 text-[9px]">&copy; 2024 Catálogo Digital</p>
        </div>
    </footer>

    <!-- BOTÓN FLOTANTE CARRITO -->
    <button id="cart-fab" onclick="app.toggleCartModal()" class="fixed bottom-6 right-6 bg-green-600 text-white rounded-full p-4 shadow-2xl z-50 hover:bg-green-700 transition-transform active:scale-95 group hidden">
        <div class="relative">
            <i data-lucide="shopping-cart" class="w-7 h-7"></i>
            <span id="cart-badge" class="absolute -top-2 -right-2 bg-red-500 text-white text-[10px] font-bold h-5 w-5 flex items-center justify-center rounded-full border-2 border-green-600">0</span>
        </div>
        <span class="absolute right-full mr-3 top-1/2 -translate-y-1/2 bg-gray-800 text-white text-xs px-2 py-1 rounded opacity-0 group-hover:opacity-100 transition whitespace-nowrap pointer-events-none">Ver pedido</span>
    </button>

    <!-- MODAL CARRITO -->
    <div id="cart-modal" class="fixed inset-0 z-[60] hidden bg-black/50 backdrop-blur-sm flex justify-end transition-opacity">
        <div class="bg-white w-full max-w-md h-full shadow-2xl flex flex-col transform transition-transform translate-x-full" id="cart-panel">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <h2 class="text-lg font-bold text-gray-800 flex items-center gap-2">
                    <i data-lucide="shopping-bag" class="text-green-600"></i> Mi Pedido
                </h2>
                <button onclick="app.toggleCartModal()" class="text-gray-400 hover:text-gray-600 p-2 rounded-full hover:bg-gray-200">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            
            <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
            
            <div class="p-4 border-t bg-gray-50">
                <div class="flex justify-between items-center mb-4">
                    <span class="text-gray-500 text-sm">Total Estimado</span>
                    <span id="cart-total" class="text-xl font-black text-gray-900">$0.00</span>
                </div>
                <!-- Botón de Envío -->
                <button id="btn-checkout" onclick="app.processOrder()" class="w-full bg-green-600 text-white py-3.5 rounded-xl font-bold text-lg shadow-lg hover:bg-green-700 transition flex items-center justify-center gap-2 active:scale-95">
                    <i data-lucide="message-circle" class="w-5 h-5"></i> Enviar Pedido
                </button>
                <p class="text-[10px] text-gray-400 text-center mt-2">Al enviar, se descontará el stock automáticamente.</p>
            </div>
        </div>
    </div>

    <!-- MODAL IMAGEN -->
    <div id="image-modal" class="fixed inset-0 z-50 hidden bg-black/95 flex items-center justify-center p-4 backdrop-blur-sm" onclick="app.closeImageModal()">
        <div class="relative max-w-4xl w-full h-full flex flex-col items-center justify-center">
            <img id="modal-img" src="" class="max-h-[85vh] max-w-full object-contain rounded-lg shadow-2xl">
            <p id="modal-caption" class="text-white mt-4 text-lg font-bold text-center"></p>
            <button class="absolute top-4 right-4 text-white/70 hover:text-white bg-white/10 hover:bg-white/20 rounded-full p-2 transition">
                <i data-lucide="x" class="w-8 h-8"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="notification" class="fixed top-24 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-[70] text-white font-medium text-sm hidden transition-all duration-300 text-center w-max max-w-[90%]">
        Mensaje
    </div>

    <script>
        const app = {
            // URL DEL SCRIPT DE GOOGLE (Reemplaza si generaste uno nuevo)
            apiUrl: "https://script.google.com/macros/s/AKfycbwczNs-lS1aUyJxpvSMuYGekx9zSHxNwWONxw3PdkLhTIbG3D6LqE7SLx4mgl-SwGV5/exec",
            whatsappNumber: "525542145295", 
            
            allProducts: [],
            cart: [], 
            
            displayList: [], 
            renderedCount: 0,
            batchSize: 20, 
            isLoadingMore: false,

            init() {
                lucide.createIcons();
                this.fetchProducts(true);
                setInterval(() => this.fetchProducts(false), 60000);

                window.addEventListener('scroll', () => {
                    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 300) {
                        this.renderNextBatch();
                    }
                });
            },

            // --- GESTIÓN DEL CARRITO ---
            toggleCartItem(sku) {
                const strSku = String(sku).trim();
                const product = this.allProducts.find(p => String(p.sku).trim() === strSku);
                
                if (!product) return;

                const index = this.cart.findIndex(item => String(item.sku).trim() === strSku);
                
                if (index > -1) {
                    this.cart.splice(index, 1); 
                    this.notify("Eliminado del pedido", "error");
                } else {
                    const maxStock = parseInt(product.stock);
                    if (maxStock > 0) {
                        this.cart.push({ ...product, qty: 1 }); 
                        this.notify("¡Agregado al pedido!", "success");
                    } else {
                        this.notify("Producto agotado", "error");
                        return;
                    }
                }
                
                this.updateCartUI();
                this.updateUI(); 
            },

            updateCartUI() {
                const badge = document.getElementById('cart-badge');
                badge.innerText = this.cart.length;
                
                const fab = document.getElementById('cart-fab');
                if (this.cart.length > 0) {
                    fab.classList.remove('hidden');
                    badge.classList.remove('badge-anim');
                    void badge.offsetWidth; 
                    badge.classList.add('badge-anim');
                } else {
                    fab.classList.add('hidden');
                }
                
                if(!document.getElementById('cart-modal').classList.contains('hidden')) {
                    this.renderCartItems();
                }
            },

            toggleCartModal() {
                const modal = document.getElementById('cart-modal');
                const panel = document.getElementById('cart-panel');
                
                if (modal.classList.contains('hidden')) {
                    modal.classList.remove('hidden');
                    this.renderCartItems();
                    setTimeout(() => panel.classList.remove('translate-x-full'), 10);
                } else {
                    panel.classList.add('translate-x-full');
                    setTimeout(() => modal.classList.add('hidden'), 300);
                }
            },

            renderCartItems() {
                const container = document.getElementById('cart-items');
                const totalLabel = document.getElementById('cart-total');
                let total = 0;

                if (this.cart.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-10 text-gray-400">
                            <i data-lucide="shopping-cart" class="w-12 h-12 mx-auto mb-2 opacity-50"></i>
                            <p>Tu pedido está vacío</p>
                            <button onclick="app.toggleCartModal()" class="mt-4 text-blue-600 text-sm font-bold">Seguir viendo</button>
                        </div>`;
                    totalLabel.innerText = "$0.00";
                    lucide.createIcons();
                    return;
                }

                container.innerHTML = this.cart.map(item => {
                    total += parseFloat(item.price);
                    return `
                        <div class="flex items-center gap-3 bg-white p-3 rounded-lg border border-gray-100 shadow-sm animate-fade-in">
                            <img src="${this.processImage(item.image)}" class="w-12 h-12 object-contain bg-gray-50 rounded">
                            <div class="flex-1 min-w-0">
                                <h4 class="text-sm font-bold text-gray-800 truncate">${item.name}</h4>
                                <p class="text-xs text-gray-500">SKU: ${item.sku}</p>
                            </div>
                            <div class="text-right">
                                <div class="font-bold text-blue-600">${this.formatPrice(item.price)}</div>
                                <button onclick="app.toggleCartItem('${item.sku}'); app.renderCartItems();" class="text-xs text-red-500 hover:text-red-700 font-medium">Quitar</button>
                            </div>
                        </div>
                    `;
                }).join('');
                
                totalLabel.innerText = this.formatPrice(total);
                lucide.createIcons();
            },

            // --- PROCESAR PEDIDO (CHECKOUT) ---
            async processOrder() {
                if (this.cart.length === 0) return;

                const btn = document.getElementById('btn-checkout');
                const originalContent = btn.innerHTML;
                
                btn.disabled = true;
                btn.innerHTML = '<div class="loader !w-5 !h-5 !border-2"></div> Procesando...';

                try {
                    // 1. Enviar descuento de stock a Google Sheets
                    const payload = {
                        action: 'checkout',
                        items: this.cart.map(i => ({ sku: i.sku, qty: i.qty }))
                    };

                    await fetch(this.apiUrl, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });

                    // 2. Abrir WhatsApp
                    this.sendOrderToWhatsapp();

                    // 3. Limpiar
                    this.cart = [];
                    this.updateCartUI();
                    this.toggleCartModal();
                    this.notify("Pedido enviado y stock descontado", "success");
                    
                    // 4. Recargar datos para ver el nuevo stock
                    setTimeout(() => this.fetchProducts(false), 2000);

                } catch (e) {
                    console.error(e);
                    this.notify("Hubo un error de conexión", "error");
                } finally {
                    btn.disabled = false;
                    btn.innerHTML = originalContent;
                    lucide.createIcons();
                }
            },

            sendOrderToWhatsapp() {
                let message = "Hola, confirmo mi pedido de Productos Better:%0A%0A";
                let total = 0;

                this.cart.forEach(item => {
                    message += `▪️ ${item.name} (SKU: ${item.sku}) - ${this.formatPrice(item.price)}%0A`;
                    total += parseFloat(item.price);
                });

                message += `%0A*Total a Pagar: ${this.formatPrice(total)}*`;
                message += "%0A%0AQuedo en espera de confirmación.";

                window.open(`https://wa.me/${this.whatsappNumber}?text=${message}`, '_blank');
            },

            // --- DATOS Y UI ---
            async fetchProducts(isInitial) {
                const loader = document.getElementById('loader-container');
                if(isInitial) loader.classList.remove('hidden');

                try {
                    const response = await fetch(`${this.apiUrl}?action=getAll`, { redirect: 'follow' });
                    const json = await response.json();

                    if (json.status === 'success') {
                        this.allProducts = json.data;
                        this.updateUI();
                        this.syncCart(); 
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    if(isInitial) loader.classList.add('hidden');
                }
            },

            syncCart() {
                this.cart = this.cart.map(cartItem => {
                    const freshItem = this.allProducts.find(p => String(p.sku).trim() === String(cartItem.sku).trim());
                    return freshItem ? { ...freshItem, qty: 1 } : cartItem;
                });
                this.updateCartUI();
                if(!document.getElementById('cart-modal').classList.contains('hidden')) {
                    this.renderCartItems();
                }
            },

            updateUI() {
                const searchTerm = document.getElementById('search-input').value.trim();
                
                this.renderMosaic();
                this.renderCarousel();

                if (searchTerm) {
                    this.filterProducts();
                } else {
                    document.getElementById('showcase-container').classList.remove('hidden');
                    document.getElementById('grid-title').innerHTML = '<i data-lucide="grid" class="text-gray-400 w-4 h-4 mr-2"></i> Catálogo Completo';
                    this.initializeGrid(this.allProducts);
                }
            },

            normalizeText(text) {
                return text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
            },

            filterProducts() {
                const input = document.getElementById('search-input');
                const clearBtn = document.getElementById('clear-search');
                const rawTerm = input.value.trim();
                const term = this.normalizeText(rawTerm);
                
                if (rawTerm.length > 0) clearBtn.classList.remove('hidden');
                else clearBtn.classList.add('hidden');

                const terms = term.split(' ').filter(t => t.length > 0);
                const filtered = this.allProducts.filter(p => {
                    const str = (p.name + " " + p.sku).normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
                    return terms.every(t => str.includes(t));
                });

                document.getElementById('showcase-container').classList.toggle('hidden', rawTerm.length > 0);
                document.getElementById('grid-title').innerHTML = rawTerm.length > 0 ? `<i data-lucide="search" class="text-blue-500 w-4 h-4 mr-2"></i> Resultados` : '<i data-lucide="grid" class="text-gray-400 w-4 h-4 mr-2"></i> Catálogo Completo';
                
                this.initializeGrid(filtered);
            },

            clearSearch() { document.getElementById('search-input').value = ''; this.updateUI(); },

            initializeGrid(list) {
                this.displayList = list;
                this.renderedCount = 0;
                const grid = document.getElementById('products-grid');
                grid.innerHTML = '';
                document.getElementById('result-count').innerText = `${list.length}`;
                
                if (list.length === 0) {
                    document.getElementById('grid-section').classList.add('hidden');
                    document.getElementById('empty-state').classList.remove('hidden');
                } else {
                    document.getElementById('grid-section').classList.remove('hidden');
                    document.getElementById('empty-state').classList.add('hidden');
                    this.renderNextBatch();
                }
                lucide.createIcons();
            },

            renderNextBatch() {
                if (this.isLoadingMore || this.renderedCount >= this.displayList.length) return;
                this.isLoadingMore = true;
                const loader = document.getElementById('scroll-loader');
                if(this.renderedCount > 0) loader.classList.remove('hidden');

                setTimeout(() => {
                    const grid = document.getElementById('products-grid');
                    const batch = this.displayList.slice(this.renderedCount, this.renderedCount + this.batchSize);
                    batch.forEach(p => grid.appendChild(this.createProductCard(p)));
                    this.renderedCount += batch.length;
                    this.isLoadingMore = false;
                    loader.classList.add('hidden');
                    lucide.createIcons();
                }, 50);
            },

            createProductCard(p) {
                const stock = parseInt(p.stock);
                const isSoldOut = stock <= 0;
                const inCart = this.cart.some(item => String(item.sku).trim() === String(p.sku).trim());
                
                const card = document.createElement('div');
                card.className = `product-card bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col h-full fade-in ${isSoldOut ? 'opacity-70' : ''}`;
                
                let btnHtml = "";
                if(isSoldOut) {
                    btnHtml = `<button disabled class="bg-gray-100 text-gray-400 p-2 rounded-full cursor-not-allowed"><i data-lucide="slash" class="w-4 h-4"></i></button>`;
                } else if(inCart) {
                    btnHtml = `<button onclick="event.stopPropagation(); app.toggleCartItem('${p.sku}')" class="bg-red-50 text-red-500 p-2 rounded-full hover:scale-110 transition border border-red-100" title="Quitar"><i data-lucide="trash-2" class="w-4 h-4"></i></button>`;
                } else {
                    btnHtml = `<button onclick="event.stopPropagation(); app.toggleCartItem('${p.sku}')" class="bg-green-50 text-green-600 p-2 rounded-full hover:scale-110 transition border border-green-100" title="Agregar"><i data-lucide="plus" class="w-4 h-4"></i></button>`;
                }

                card.innerHTML = `
                    <div class="h-40 md:h-48 w-full bg-white p-3 flex items-center justify-center relative cursor-pointer" onclick="app.openImageModal('${this.processImage(p.image)}', '${p.name}')">
                        <img src="${this.processImage(p.image)}" class="w-full h-full object-contain hover:scale-105 transition-transform duration-300" loading="lazy" onerror="this.style.display='none'">
                        ${isSoldOut ? `<div class="absolute inset-0 bg-white/50 flex items-center justify-center"><span class="bg-gray-800 text-white text-[10px] font-bold px-2 py-1 rounded shadow">AGOTADO</span></div>` : ''}
                    </div>
                    <div class="p-3 flex flex-col flex-1 border-t border-gray-50 bg-gray-50/30">
                        <p class="text-[9px] text-gray-400 font-mono mb-1 uppercase">SKU: ${p.sku}</p>
                        <h3 class="text-xs md:text-sm font-bold text-gray-800 leading-snug mb-2 line-clamp-2 flex-1" title="${p.name}">${p.name}</h3>
                        <div class="mt-auto flex justify-between items-center">
                            <span class="text-base md:text-lg font-black text-gray-900">${this.formatPrice(p.price)}</span>
                            ${btnHtml}
                        </div>
                    </div>`;
                return card;
            },

            // --- RENDERIZADO EXTRA ---
            renderMosaic() {
                const container = document.getElementById('featured-mosaic');
                if(this.allProducts.length === 0 || container.children.length > 0) return;
                const shuffled = [...this.allProducts].sort(() => 0.5 - Math.random()).slice(0, 4);
                let html = '';
                shuffled.forEach(p => {
                    const isSoldOut = parseInt(p.stock) <= 0;
                    const inCart = this.cart.some(item => String(item.sku).trim() === String(p.sku).trim());
                    
                    // Botón para mosaico
                    let btnIcon = 'plus-circle';
                    let btnClass = 'text-gray-400 hover:text-green-600';
                    
                    if(isSoldOut) { btnIcon = 'slash'; btnClass = 'text-gray-300 cursor-not-allowed'; }
                    else if(inCart) { btnIcon = 'trash-2'; btnClass = 'text-red-500 hover:text-red-700'; }

                    html += `
                        <div class="relative bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group transition hover:shadow-md ${isSoldOut ? 'opacity-75' : ''}">
                            <div class="h-40 md:h-48 bg-white p-4 flex items-center justify-center relative cursor-pointer" onclick="app.openImageModal('${this.processImage(p.image)}', '${p.name}')">
                                <img src="${this.processImage(p.image)}" class="w-full h-full object-contain img-hover-scale">
                                <span class="absolute top-2 left-2 bg-yellow-400 text-yellow-900 text-[9px] font-bold px-1.5 py-0.5 rounded shadow-sm">TOP</span>
                                ${isSoldOut ? `<div class="absolute inset-0 flex items-center justify-center bg-white/40"><span class="bg-black text-white text-[9px] px-2 py-1 rounded">AGOTADO</span></div>` : ''}
                            </div>
                            <div class="p-3 border-t border-gray-50 bg-gray-50/50 flex-1 flex flex-col">
                                <h3 class="text-gray-800 text-xs font-bold line-clamp-1 mb-1">${p.name}</h3>
                                <div class="mt-auto flex justify-between items-center">
                                    <p class="text-blue-600 font-bold text-sm">${this.formatPrice(p.price)}</p>
                                    <button onclick="event.stopPropagation(); app.toggleCartItem('${p.sku}')" class="${btnClass}" ${isSoldOut ? 'disabled' : ''}><i data-lucide="${btnIcon}" class="w-5 h-5"></i></button>
                                </div>
                            </div>
                        </div>`;
                });
                container.innerHTML = html;
            },

            renderCarousel() {
                const track = document.getElementById('carousel-track');
                if(track.children.length > 0) return;
                const recent = this.allProducts.slice(0, 10); 
                track.innerHTML = recent.map(p => {
                    const isSoldOut = parseInt(p.stock) <= 0;
                    const inCart = this.cart.some(item => String(item.sku).trim() === String(p.sku).trim());
                    let btnIcon = 'plus-circle';
                    let btnClass = 'text-gray-400 hover:text-green-600';
                    
                    if(isSoldOut) { btnIcon = 'slash'; btnClass = 'text-gray-300 cursor-not-allowed'; }
                    else if(inCart) { btnIcon = 'trash-2'; btnClass = 'text-red-500 hover:text-red-700'; }

                    return `
                    <div class="snap-start shrink-0 w-36 md:w-44 bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden flex flex-col transition hover:shadow-md ${isSoldOut ? 'opacity-75' : ''}">
                        <div class="h-36 md:h-44 bg-white p-3 relative flex items-center justify-center cursor-pointer" onclick="app.openImageModal('${this.processImage(p.image)}', '${p.name}')">
                            <img src="${this.processImage(p.image)}" class="w-full h-full object-contain" loading="lazy">
                            <span class="absolute top-2 right-2 bg-blue-100 text-blue-700 text-[8px] font-bold px-1.5 py-0.5 rounded">NUEVO</span>
                            ${isSoldOut ? `<div class="absolute inset-0 flex items-center justify-center bg-white/40"><span class="bg-black text-white text-[9px] px-2 py-1 rounded">AGOTADO</span></div>` : ''}
                        </div>
                        <div class="p-2 md:p-3 flex-1 flex flex-col border-t border-gray-50">
                            <h4 class="text-[10px] md:text-xs font-bold text-gray-700 line-clamp-2 mb-1">${p.name}</h4>
                            <div class="mt-auto flex justify-between items-center">
                                <p class="text-blue-600 font-bold text-xs md:text-sm">${this.formatPrice(p.price)}</p>
                                <button onclick="event.stopPropagation(); app.toggleCartItem('${p.sku}')" class="${btnClass}" ${isSoldOut ? 'disabled' : ''}><i data-lucide="${btnIcon}" class="w-4 h-4"></i></button>
                            </div>
                        </div>
                    </div>`}).join('');
                
                if (this.carouselInterval) clearInterval(this.carouselInterval);
                this.carouselInterval = setInterval(() => {
                    if (track.scrollWidth - track.clientWidth <= track.scrollLeft + 10) track.scrollTo({ left: 0, behavior: 'smooth' });
                    else track.scrollBy({ left: 160, behavior: 'smooth' });
                }, 4000);
            },

            // UTILS
            openImageModal(src, title) { if(!src) return; document.getElementById('modal-img').src = src.replace('sz=w600', 'sz=w1200'); document.getElementById('modal-caption').innerText = title; document.getElementById('image-modal').classList.remove('hidden'); },
            closeImageModal() { document.getElementById('image-modal').classList.add('hidden'); document.getElementById('modal-img').src = ''; },
            processImage(link) { if (!link) return ''; const idMatch = link.match(/id=([a-zA-Z0-9_-]{25,})/) || link.match(/\/d\/([a-zA-Z0-9_-]{25,})\//); if (idMatch) return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w600`; return link; },
            formatPrice(p) { return parseFloat(p).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' }); },
            notify(msg, type) { const el = document.getElementById('notification'); el.innerText = msg; el.className = `fixed top-24 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full shadow-2xl z-[70] text-white font-medium text-sm transition-all duration-300 text-center w-max max-w-[90%] ${type === 'error' ? 'bg-red-600' : 'bg-green-600'}`; el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 3000); }
        };

        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
